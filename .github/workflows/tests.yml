name: tests

# When to run: on every push to main, and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflows only need to read the code.
permissions:
  contents: read

jobs:
  # 1. The 47 guardrail tests against SQLite. No database server, no keys, no model.
  guardrail-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGFUSE_TRACING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install langfuse python-dotenv
      - name: Run the guardrail tests
        run: python -m unittest test_guardrails -v

  # 2. Postgres itself enforces the rules. A throwaway Postgres container is started, loaded
  #    with the seed data and the roles generated from policy.py, and the pass/fail checks run
  #    against it. The passwords below are throwaway values for a container that is destroyed
  #    when the job ends; they protect nothing and are not secrets.
  postgres-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: governed
          POSTGRES_PASSWORD: ciadminpassword
          POSTGRES_DB: governed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U governed -d governed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # for psql
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: governed
      PGPASSWORD: ciadminpassword
      PGDATABASE: governed
      # for the Python checks
      DB_BACKEND: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: governed
      POSTGRES_AGENT_PASSWORD: ciagentpassword
      POSTGRES_REVIEWER_PASSWORD: cireviewerpassword
      LANGFUSE_TRACING_ENABLED: "false"
      LANGFUSE_PUBLIC_KEY: pk-lf-ci
      LANGFUSE_SECRET_KEY: sk-lf-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install "psycopg[binary]" langfuse python-dotenv

      - name: Load the schema and seed data
        run: |
          python export_postgres_seed.py --out /tmp/seed.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/seed.sql

      - name: Check the loaded data
        run: |
          psql -f sql/postgres_check.sql | tee /tmp/data-check.txt
          grep -qw PASS /tmp/data-check.txt
          ! grep -qw FAIL /tmp/data-check.txt

      - name: Generate and load the roles from policy.py
        run: |
          python generate_postgres_roles.py > /tmp/roles.sql
          psql -v ON_ERROR_STOP=1 \
            -v agent_password="$POSTGRES_AGENT_PASSWORD" \
            -v reviewer_password="$POSTGRES_REVIEWER_PASSWORD" \
            -f /tmp/roles.sql

      - name: Verify the roles (Postgres refuses what policy.py forbids)
        run: |
          psql -f sql/postgres_roles_verify.sql | tee /tmp/roles-check.txt
          grep -qw PASS /tmp/roles-check.txt
          ! grep -qw FAIL /tmp/roles-check.txt

      - name: Read and write path checks
        run: python pg_check.py

      - name: Delete and approval path checks
        run: python pg_approvals_check.py
