services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: governed-postgres:17
    # pgaudit must be preloaded when the server starts. Rebuild with: docker compose up -d --build db
    command: ["postgres", "-c", "shared_preload_libraries=pgaudit", "-c", "log_line_prefix=%m [%p] %u@%d "]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-governed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-governed}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-governed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-governed}

volumes:
  pgdata:
